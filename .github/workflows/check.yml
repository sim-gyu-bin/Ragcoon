name: 앱·배포 코드 검사

on:
  pull_request:
  push:
    branches: [develop]
  workflow_call:
    inputs:
      force_check_failure:
        description: 배포 차단·실패 알림 인수 시험
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: 통제된 검사 실패
        if: ${{ inputs.force_check_failure }}
        run: |
          echo '::error::요청한 실패 시험입니다. 이미지 게시와 VM 배포를 건너뜁니다.'
          exit 1
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: 배포 코드 오프라인 회귀 검사
        run: python3 -B -m unittest discover -s infra/tests
      - name: 모델 키·외부망 없이 API 회귀 검사
        run: |
          docker build --target test -t ragcoon-api-test apps/api
          docker run --rm --network none ragcoon-api-test
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.5'
      - name: 웹 검사·테스트·타입 검사·빌드
        working-directory: apps/web
        run: |
          corepack pnpm install --frozen-lockfile
          corepack pnpm check
          corepack pnpm test
          corepack pnpm build
