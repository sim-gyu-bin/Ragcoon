name: 운영 ARM64 배포 시험

on:
  workflow_dispatch:
    inputs:
      force_check_failure:
        description: 검사에서 의도적으로 실패시켜 배포 차단과 알림을 확인
        type: boolean
        default: false

permissions: {}

# 공개 시험과 Picksy 복구가 끝날 때까지 다른 main 배포가 선점하지 않는다.
concurrency:
  group: ragcoon-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: 원본 저장소 main의 수동 실행만 허용
        run: |
          [[ "${GITHUB_REPOSITORY,,}" == sim-gyu-bin/ragcoon ]]
          [[ "$GITHUB_REF" == refs/heads/main && "$GITHUB_EVENT_NAME" == workflow_dispatch ]]

  check:
    needs: gate
    permissions:
      contents: read
    uses: ./.github/workflows/check.yml
    with:
      force_check_failure: ${{ inputs.force_check_failure }}

  build:
    needs: check
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      api: ${{ steps.publish.outputs.api }}
      caddy: ${{ steps.publish.outputs.caddy }}
    env:
      REGISTRY: ghcr.io/sim-gyu-bin/ragcoon
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: 비공개 패키지 대상만 허용
        run: |
          set -euo pipefail
          umask 077
          ticket=$(mktemp "$RUNNER_TEMP/ragcoon-anonymous.XXXXXX")
          trap 'rm -f -- "$ticket"' EXIT
          for service in api caddy; do
            # 개인 계정의 첫 GHCR 게시는 비공개다. 기존 이름이 익명 pull을 허용하면 덮어쓰지 않는다.
            repo="sim-gyu-bin/ragcoon-$service"
            status=$(curl -sS --max-time 20 -o "$ticket" -w '%{http_code}' \
              "https://ghcr.io/token?service=ghcr.io&scope=repository:$repo:pull")
            case "$status" in
              401|403) continue ;;
              200) ;;
              *) echo '::error::GHCR 익명 접근 정책을 확인하지 못했습니다.'; exit 1 ;;
            esac
            status=$(jq -er '.token | strings | select(length > 0) | "Authorization: Bearer " + .' "$ticket" |
              curl -sS --max-time 20 --header @- -o /dev/null -w '%{http_code}' "https://ghcr.io/v2/$repo/tags/list?n=1")
            case "$status" in
              401|403|404) ;;
              *) echo '::error::공개 패키지이거나 공개 여부를 확인하지 못했습니다.'; exit 1 ;;
            esac
          done
      - name: ARM64 빌드·게시 및 게시된 digest 고정
        id: publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$(uname -m)" == aarch64 ]]
          umask 077
          export DOCKER_CONFIG
          DOCKER_CONFIG=$(mktemp -d "$RUNNER_TEMP/ragcoon-registry.XXXXXX")
          trap 'rm -rf -- "$DOCKER_CONFIG"' EXIT
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin >/dev/null 2>&1
          unset GITHUB_TOKEN
          for service in api caddy; do
            context=apps/api
            if [[ "$service" == caddy ]]; then context=apps/web; fi
            image="$REGISTRY-$service"
            # 태그 재조회가 아니라 바로 이 push의 결과에서 digest를 얻는다.
            docker buildx build --platform linux/arm64 --provenance=false --push \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
              --tag "$image:$GITHUB_SHA" --metadata-file "$RUNNER_TEMP/$service.json" "$context"
            digest=$(jq -er '.["containerimage.digest"]' "$RUNNER_TEMP/$service.json")
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            printf '%s=%s@%s\n' "$service" "$image" "$digest" >> "$GITHUB_OUTPUT"
          done

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      packages: read
      id-token: write
    steps:
      - name: 사설망과 대상 IPv4 설정 확인
        env:
          TS_OIDC_CLIENT_ID: ${{ vars.TS_OIDC_CLIENT_ID }}
          TS_OIDC_AUDIENCE: ${{ vars.TS_OIDC_AUDIENCE }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          [[ -n "$TS_OIDC_CLIENT_ID" && -n "$TS_OIDC_AUDIENCE" ]]
          python3 - <<'PY'
          import ipaddress
          import os
          try:
              allowed = ipaddress.IPv4Address(os.environ['DEPLOY_HOST']) in ipaddress.IPv4Network('100.64.0.0/10')
          except ValueError:
              allowed = False
          if not allowed:
              raise SystemExit('배포 호스트는 Tailscale IPv4여야 합니다.')
          PY
      - uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4
        with:
          oauth-client-id: ${{ vars.TS_OIDC_CLIENT_ID }}
          audience: ${{ vars.TS_OIDC_AUDIENCE }}
          tags: tag:ragcoon-ci
          version: 1.104.7
          use-cache: 'false'
          retry: '1'
          timeout: 2m
          log-mode: quiet
      - name: 사전 설치된 SSH receiver의 검증·복구 완료까지 대기
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          API_IMAGE: ${{ needs.build.outputs.api }}
          CADDY_IMAGE: ${{ needs.build.outputs.caddy }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ -n "$DEPLOY_SSH_KEY" && -n "$DEPLOY_KNOWN_HOSTS" && -n "$GITHUB_TOKEN" ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$API_IMAGE" =~ ^ghcr\.io/sim-gyu-bin/ragcoon-api@sha256:[0-9a-f]{64}$ ]]
          [[ "$CADDY_IMAGE" =~ ^ghcr\.io/sim-gyu-bin/ragcoon-caddy@sha256:[0-9a-f]{64}$ ]]
          umask 077
          dir=$(mktemp -d "$RUNNER_TEMP/ragcoon-ssh.XXXXXX")
          trap 'rm -rf -- "$dir"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$dir/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$dir/known_hosts"
          unset DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS
          # 토큰은 인자·파일·output이 아닌 stdin 한 줄로만 전달한다. 원격 명령은 지정하지 않는다.
          jq -cn '{revision:env.GITHUB_SHA,api:env.API_IMAGE,caddy:env.CADDY_IMAGE,username:env.GITHUB_ACTOR,token:env.GITHUB_TOKEN}' |
            ssh -F /dev/null -T -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent=none \
              -o ClearAllForwardings=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null \
              -o UserKnownHostsFile="$dir/known_hosts" -o ConnectTimeout=15 -o ServerAliveInterval=15 \
              -o ServerAliveCountMax=4 -i "$dir/key" "ragcoon-o03@$DEPLOY_HOST" 2>/dev/null |
            {
              ready=false
              while IFS= read -r line; do
                if [[ "$line" == LOCAL_SMOKE_OK ]]; then
                  echo LOCAL_SMOKE_OK
                  ready=true
                fi
              done
              [[ "$ready" == true ]]
            }

  notify:
    needs: [gate, check, build, deploy]
    if: ${{ always() && github.repository == 'sim-gyu-bin/Ragcoon' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: infra/notify.py
          sparse-checkout-cone-mode: false
      - name: 승인된 개인 Telegram 대화로 실행 결과만 통보
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GATE_RESULT: ${{ needs.gate.result }}
          CHECK_RESULT: ${{ needs.check.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: python3 -I -B infra/notify.py
