name: ragcoon
services:
  api:
    build: ./apps/api
    environment:
      RAGCOON_DB: /data/ragcoon.sqlite3
      CHROMA_PATH: /data/chroma
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANONYMIZED_TELEMETRY: "False"
    volumes:
      - documents:/data
  caddy:
    build: ./apps/web
    ports:
      - "127.0.0.1:18730:80"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - api

volumes:
  documents:
