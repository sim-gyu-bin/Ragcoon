[project]
name = "ragcoon-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "chromadb>=1,<2",
    "fastapi>=0.115,<1",
    "langchain-openai>=1,<2",
    "langgraph>=1,<2",
    "langsmith>=0.4,<1",
    "openai>=2,<3",
    "pypdf>=6,<7",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true
